services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitzy
      POSTGRES_PASSWORD: splitzy
      POSTGRES_DB: splitzy_dev
    ports:
      - "5432:5432"
    volumes:
      - splitzy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitzy -d splitzy_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  splitzy_postgres_data:
